name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cl-stack-brotli-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  BROTLI_VERSION: "1.2.0"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_os: linux
            platform_arch: amd64
          - os: macos-latest
            platform_os: darwin
            platform_arch: arm64
          - os: windows-latest
            platform_os: windows
            platform_arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-client@main

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Build Brotli shared libs (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-brotli.sh
          ./scripts/build-brotli.sh

      - name: Build Brotli shared libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-brotli.ps1

      - name: Install Roswell (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell
          mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
          /c/roswell/roswell/ros.exe version

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: cl-repo install deps
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:"
          ros -l scripts/ci-install.lisp -q

      - name: Test
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:"
          ros -l scripts/ci-test.lisp -q
