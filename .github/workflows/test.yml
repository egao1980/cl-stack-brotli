name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cl-stack-brotli-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.4.11
  ROSWELL_VERSION: "26.02.116"
  BROTLI_VERSION: "1.2.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_os: linux
            platform_arch: amd64
          - os: macos-latest
            platform_os: darwin
            platform_arch: arm64
          - os: windows-latest
            platform_os: windows
            platform_arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Build Brotli shared libs (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-brotli.sh
          ./scripts/build-brotli.sh

      - name: Build Brotli shared libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-brotli.ps1

      - name: Install Roswell (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell
          mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
          /c/roswell/roswell/ros.exe version

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ros install qlot
          qlot install

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ros install rove
          ros install trivial-gray-streams
          ros install cffi

      - name: Test cl-stack-brotli (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          qlot exec ros -S . -e '(asdf:test-system "cl-stack-brotli")'

      - name: Test cl-stack-brotli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:"
          ros -S . -e '(asdf:test-system "cl-stack-brotli")' -q
