name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cl-stack-brotli-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  BROTLI_VERSION: "1.2.0"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_os: linux
            platform_arch: amd64
          - os: macos-latest
            platform_os: darwin
            platform_arch: arm64
          - os: windows-latest
            platform_os: windows
            platform_arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-client@main

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Build Brotli shared libs (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-brotli.sh
          ./scripts/build-brotli.sh

      - name: Build Brotli shared libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-brotli.ps1

      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: cl-repo install deps
        shell: bash
        run: |
          ros -l scripts/ci-install.lisp -q

      - name: Test
        shell: bash
        run: |
          ros -l scripts/ci-test.lisp -q
