# Build Brotli shared libs (full matrix) + publish via cl-repository reusable workflow.
name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, upstream + revision (input, else v* tag, else .asd :version); Brotli builds from the first three parts"
        required: false
        default: ""
      registry:
        description: "OCI registry (default: ghcr.io)"
        required: false
        default: "ghcr.io"

jobs:
  # Package version = upstream Brotli version + package revision. Input, else
  # the v* tag, else the .asd :version; Brotli builds from the first three parts.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      upstream: ${{ steps.ver.outputs.upstream }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            V="$(sed -nE 's/^[[:space:]]*:version[[:space:]]+"([^"]+)".*/\1/p' cl-stack-brotli.asd | head -1)"
          fi
          [ -n "$V" ] || { echo "could not resolve package version" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "upstream=$(echo "$V" | cut -d. -f1-3)" >> "$GITHUB_OUTPUT"
          echo "package version=$V"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl patchelf

      - name: Install build deps (macOS)
        if: matrix.os == 'darwin'
        run: brew install cmake || true

      - name: Build Brotli shared libs (Unix)
        if: matrix.os != 'windows'
        env:
          BROTLI_VERSION: ${{ needs.resolve-version.outputs.upstream }}
        run: |
          chmod +x scripts/build-brotli.sh
          ./scripts/build-brotli.sh
          mkdir -p native-bundle
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/

      - name: Build Brotli shared libs (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          BROTLI_VERSION: ${{ needs.resolve-version.outputs.upstream }}
        run: |
          .\scripts\build-brotli.ps1
          New-Item -ItemType Directory -Force -Path native-bundle | Out-Null
          Copy-Item -Path "lib\${{ matrix.os }}-${{ matrix.arch }}\*" -Destination native-bundle -Recurse -Force

      - name: Upload native artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: cl-stack-brotli
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      source-paths: |
        cl-stack-brotli.asd
        src
        LICENSE
        README.md
        NOTICE
    secrets: inherit
